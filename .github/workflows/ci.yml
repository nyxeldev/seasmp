name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  REGISTRY:    ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Lint ────────────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --workspace=apps/api --workspace=apps/web

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Lint API
        working-directory: apps/api
        run: npm run lint

      - name: Lint Web
        working-directory: apps/web
        run: npm run lint

  # ─── Unit tests ──────────────────────────────────────────────────────────────
  test-unit:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --workspace=apps/api

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run unit tests
        working-directory: apps/api
        run: npm test
        env:
          JWT_ACCESS_SECRET:    test-access-secret-that-is-long-enough-for-zod
          JWT_REFRESH_SECRET:   test-refresh-secret-that-is-long-enough-for-zod
          AES_ENCRYPTION_KEY:   b7dcb02c6342b24134b3a09db4d897c16df22aa9034a757d4d0028118159a756
          DISABLE_2FA_REQUIRED: 'false'

  # ─── Integration tests ───────────────────────────────────────────────────────
  test-integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: lint

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB:       seasmp_test
          POSTGRES_USER:     seasmp
          POSTGRES_PASSWORD: testpassword
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U seasmp -d seasmp_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7.4-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci --workspace=apps/api

      - name: Generate Prisma client
        working-directory: apps/api
        run: npx prisma generate

      - name: Run DB migrations
        working-directory: apps/api
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://seasmp:testpassword@localhost:5432/seasmp_test

      - name: Run integration tests
        working-directory: apps/api
        run: npm run test:integration
        env:
          TEST_DATABASE_URL:    postgresql://seasmp:testpassword@localhost:5432/seasmp_test
          REDIS_URL:            redis://localhost:6379
          JWT_ACCESS_SECRET:    test-access-secret-that-is-long-enough-for-zod
          JWT_REFRESH_SECRET:   test-refresh-secret-that-is-long-enough-for-zod
          AES_ENCRYPTION_KEY:   b7dcb02c6342b24134b3a09db4d897c16df22aa9034a757d4d0028118159a756
          NODE_ENV:             test
          API_PORT:             4000
          API_HOST:             0.0.0.0
          CORS_ORIGIN:          http://localhost:3000
          DISABLE_2FA_REQUIRED: 'false'

  # ─── Python tests ────────────────────────────────────────────────────────────
  test-python:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: apps/analytics/requirements.txt

      - name: Install deps
        working-directory: apps/analytics
        run: pip install -r requirements.txt pytest pytest-cov httpx

      - name: Run Python tests
        working-directory: apps/analytics
        run: pytest --cov=src --cov-report=term-missing
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/seasmp_test
          REDIS_URL:    redis://localhost:6379

  # ─── Build & push Docker images ──────────────────────────────────────────────
  build:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: [test-unit, test-integration, test-python]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/seasmp-api:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/seasmp-api:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build and push Analytics
        uses: docker/build-push-action@v6
        with:
          context: ./apps/analytics
          file: apps/analytics/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/seasmp-analytics:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/seasmp-analytics:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max

      - name: Build and push Frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/seasmp-frontend:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/seasmp-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to:   type=gha,mode=max
