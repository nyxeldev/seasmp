services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: seasmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - seasmp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: seasmp-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - seasmp-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Node.js API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: seasmp-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV:               production
      DATABASE_URL:           "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL:              "redis://:${REDIS_PASSWORD}@redis:6379"
      ANALYTICS_API_URL:      "http://seasmp-analytics:5000"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      analytics:
        condition: service_healthy
    networks:
      - seasmp-network

  # ─── Python Analytics ────────────────────────────────────────────────────────
  analytics:
    build:
      context: ./apps/analytics
      dockerfile: Dockerfile
    container_name: seasmp-analytics
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL:    "redis://:${REDIS_PASSWORD}@redis:6379"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - analytics_models:/app/model
    networks:
      - seasmp-network

  # ─── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: seasmp-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV:                  production
      NEXT_PUBLIC_API_URL:       "http://localhost:4000"
      NEXT_PUBLIC_ANALYTICS_URL: "http://localhost:5000"
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - seasmp-network

  # ─── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.26-alpine
    container_name: seasmp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - api
    networks:
      - seasmp-network

volumes:
  postgres_data:
  redis_data:
  analytics_models:

networks:
  seasmp-network:
    driver: bridge
