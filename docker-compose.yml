# Loyiha nomi papka nomidan olinmasin: volume nomlari shundan yasaladi
# (seasmp_postgres_data, seasmp_analytics_models). Papka boshqa nom bilan
# klon qilinsa, nomni qotirmasak volumelar mos kelmay, baza bo'sh ko'rinadi.
name: seasmp

services:

  # ─── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: seasmp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - seasmp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: seasmp-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - seasmp-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Node.js API ─────────────────────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: seasmp-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV:               production
      DATABASE_URL:           "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL:              "redis://:${REDIS_PASSWORD}@redis:6379"
      ANALYTICS_API_URL:      "http://seasmp-analytics:5000"
      # API faqat ichki tarmoqda — X-Forwarded-For ni Nginx qo'yadi va unga
      # ishonsa bo'ladi. Usiz request.ip proksi IP si bo'lib qoladi.
      TRUST_PROXY:            "true"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      analytics:
        condition: service_healthy
    volumes:
      # Yuklangan avatarlar. Volume'siz konteyner qayta qurilganda
      # (yoki ko'p nusxada ishlaganda) fayllar yo'qolardi — xuddi
      # analytics_models kabi sabab.
      - api_uploads:/app/apps/api/uploads
    networks:
      - seasmp-network

  # ─── Python Analytics ────────────────────────────────────────────────────────
  analytics:
    build:
      context: ./apps/analytics
      dockerfile: Dockerfile
    container_name: seasmp-analytics
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL:    "redis://:${REDIS_PASSWORD}@redis:6379"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # MODEL_DIR ning o'zi. Ilgari /app/model ga ulangan edi, kod esa
      # /app/ml/models ga yozardi — o'qitilgan model saqlanmay yo'qolardi.
      - analytics_models:/app/ml/models
    networks:
      - seasmp-network

  # ─── Celery Worker (Analytics) ────────────────────────────────────────────────
  #
  # celery_app.py'da nightly-risk, daily-cache, monthly-retrain va
  # retention-cleanup rejalashtirilgan edi, lekin ularni haqiqatda
  # BAJARUVCHI jarayon hech qachon ishga tushirilmagan — shu konteyner aynan
  # shu bo'shliqni yopadi. Bitta image (analytics bilan bir xil Dockerfile)
  # — shuning uchun src/ import yo'llari, muhit o'zgaruvchilari va
  # schema_contract tekshiruvi (worker_process_init, celery_app.py) aynan
  # API konteyneridagi kabi ishlaydi.
  celery-worker:
    build:
      context: ./apps/analytics
      dockerfile: Dockerfile
    container_name: seasmp-celery-worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL:    "redis://:${REDIS_PASSWORD}@redis:6379"
    # `-A src.tasks.celery_app:celery` — Dockerfile WORKDIR /app bo'lgani
    # uchun `src.tasks.celery_app` moduli to'g'ridan-to'g'ri import qilinadi
    # (apps/analytics/src/tasks/celery_app.py), `:celery` esa shu moduldagi
    # Celery nusxasining aniq nomi (boshqa konvensiyaga — `app` — tayanib
    # noto'g'ri topilib qolmasligi uchun aniq ko'rsatilgan).
    command: ["celery", "-A", "src.tasks.celery_app:celery", "worker", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - analytics_models:/app/ml/models
    networks:
      - seasmp-network
    healthcheck:
      test: ["CMD-SHELL", "celery -A src.tasks.celery_app:celery inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ─── Celery Beat (Analytics) ──────────────────────────────────────────────────
  #
  # Rejalashtiruvchi — vazifalarni o'zi BAJARMAYDI, faqat belgilangan vaqtda
  # Redis orqali navbatga qo'yadi (celery-worker ularni bajaradi). Shuning
  # uchun DB/model volume kerak emas, va worker buyrug'ida `-B`/`--beat`
  # YO'Q — aks holda ikki alohida beat rejalashtiruvchi bir vaqtda ishlab,
  # har bir vazifa ikki marta navbatga tushardi. Butun stackda faqat shu
  # BITTA beat jarayoni bor.
  celery-beat:
    build:
      context: ./apps/analytics
      dockerfile: Dockerfile
    container_name: seasmp-celery-beat
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL:    "redis://:${REDIS_PASSWORD}@redis:6379"
    command: ["celery", "-A", "src.tasks.celery_app:celery", "beat", "--loglevel=info"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - seasmp-network
    # Dockerfile'ning o'zida HEALTHCHECK bor (http://localhost:5000/health) —
    # bu analytics (FastAPI/uvicorn) konteyneri uchun to'g'ri, lekin beat
    # hech qanday portda tinglamaydi, shuning uchun shu tekshiruv bu yerda
    # doim muvaffaqiyatsiz bo'lardi (toki jarayon tirik bo'lsa ham). O'chirib
    # qo'yildi — jarayonning o'zi tirikligi `docker compose ps`dagi holat
    # bilan ko'rinadi.
    healthcheck:
      disable: true

  # ─── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: seasmp-frontend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV:                  production
      NEXT_PUBLIC_API_URL:       "http://localhost:4000"
      NEXT_PUBLIC_ANALYTICS_URL: "http://localhost:5000"
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - seasmp-network

  # ─── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.26-alpine
    container_name: seasmp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - api
    networks:
      - seasmp-network

volumes:
  postgres_data:
  redis_data:
  analytics_models:
  api_uploads:

networks:
  seasmp-network:
    driver: bridge
