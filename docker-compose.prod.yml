services:

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    image: postgres:17-alpine
    container_name: seasmp-postgres
    restart: always
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - seasmp-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    image: redis:7.4-alpine
    container_name: seasmp-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    networks:
      - seasmp-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Node.js API ─────────────────────────────────────────────────────────────
  api:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER}/seasmp-api:${IMAGE_TAG:-latest}
    container_name: seasmp-api
    restart: always
    env_file: .env.prod
    environment:
      NODE_ENV:     production
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL:    "redis://:${REDIS_PASSWORD}@redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - seasmp-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ─── Python Analytics ────────────────────────────────────────────────────────
  analytics:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER}/seasmp-analytics:${IMAGE_TAG:-latest}
    container_name: seasmp-analytics
    restart: always
    env_file: .env.prod
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}"
      REDIS_URL:    "redis://:${REDIS_PASSWORD}@redis:6379"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - analytics_models:/app/model
    networks:
      - seasmp-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ─── Next.js Frontend ────────────────────────────────────────────────────────
  frontend:
    image: ${REGISTRY:-ghcr.io}/${IMAGE_OWNER}/seasmp-frontend:${IMAGE_TAG:-latest}
    container_name: seasmp-frontend
    restart: always
    env_file: .env.prod
    environment:
      NODE_ENV:                  production
      NEXT_PUBLIC_API_URL:       ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_ANALYTICS_URL: ${NEXT_PUBLIC_ANALYTICS_URL}
    depends_on:
      - api
    networks:
      - seasmp-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000 || exit 1"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ─── Nginx ───────────────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.26-alpine
    container_name: seasmp-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - api
    networks:
      - seasmp-network

volumes:
  postgres_data:
  redis_data:
  analytics_models:

networks:
  seasmp-network:
    driver: bridge
