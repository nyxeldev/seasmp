events {
  worker_connections 1024;
}

http {
  # ─── Rate Limiting ────────────────────────────────────────────────────────
  limit_req_zone $binary_remote_addr zone=api:10m    rate=100r/m;
  limit_req_zone $binary_remote_addr zone=login:10m  rate=10r/m;
  limit_req_zone $binary_remote_addr zone=static:10m rate=200r/m;

  # ─── Security Headers ─────────────────────────────────────────────────────
  add_header X-Frame-Options          "DENY"                              always;
  add_header X-Content-Type-Options   "nosniff"                           always;
  add_header X-XSS-Protection         "1; mode=block"                     always;
  add_header Referrer-Policy          "strict-origin-when-cross-origin"   always;
  add_header Permissions-Policy       "camera=(), microphone=(), geolocation=()" always;
  add_header Content-Security-Policy  "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' ws: wss:;" always;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  # ─── Gzip ─────────────────────────────────────────────────────────────────
  gzip on;
  gzip_types text/plain application/json application/javascript text/css text/xml;
  gzip_min_length 1024;

  # ─── Client limits ────────────────────────────────────────────────────────
  client_max_body_size 10M;

  # ─── Upstreams ────────────────────────────────────────────────────────────
  upstream api_backend {
    server api:4000;
    keepalive 32;
  }

  upstream analytics_backend {
    server analytics:5000;
    keepalive 8;
  }

  upstream frontend_backend {
    server frontend:3000;
    keepalive 16;
  }

  # ─── HTTP Server ──────────────────────────────────────────────────────────
  server {
    listen 80;
    server_name _;

    # Login — strict rate limit
    location = /v1/auth/login {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass         http://api_backend;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Auth endpoints — stricter limit
    location /v1/auth/ {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass         http://api_backend;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Analytics API — internal only (Docker network)
    location /analytics/ {
      allow  172.16.0.0/12;
      allow  10.0.0.0/8;
      allow  192.168.0.0/16;
      deny   all;
      proxy_pass         http://analytics_backend;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
    }

    # API — general rate limit
    location /v1/ {
      limit_req zone=api burst=20 nodelay;
      limit_req_status 429;
      proxy_pass         http://api_backend;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
    }

    # WebSocket
    location /ws {
      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
    }

    # Frontend — everything else
    location / {
      limit_req zone=static burst=50 nodelay;
      proxy_pass         http://frontend_backend;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }

  # ─── HTTPS Server ─────────────────────────────────────────────────────────
  server {
    listen 443 ssl;
    server_name _;

    ssl_certificate      /etc/nginx/ssl/cert.pem;
    ssl_certificate_key  /etc/nginx/ssl/key.pem;
    ssl_protocols        TLSv1.2 TLSv1.3;
    ssl_ciphers          ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache    shared:SSL:10m;
    ssl_session_timeout  1d;

    location = /v1/auth/login {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass         http://api_backend;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /v1/auth/ {
      limit_req zone=login burst=5 nodelay;
      limit_req_status 429;
      proxy_pass         http://api_backend;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /analytics/ {
      allow  172.16.0.0/12;
      allow  10.0.0.0/8;
      allow  192.168.0.0/16;
      deny   all;
      proxy_pass         http://analytics_backend;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
    }

    location /v1/ {
      limit_req zone=api burst=20 nodelay;
      limit_req_status 429;
      proxy_pass         http://api_backend;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_http_version 1.1;
      proxy_set_header   Connection "";
    }

    location /ws {
      proxy_pass         http://api_backend;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade    $http_upgrade;
      proxy_set_header   Connection "upgrade";
      proxy_set_header   Host       $host;
      proxy_set_header   X-Real-IP  $remote_addr;
    }

    location / {
      limit_req zone=static burst=50 nodelay;
      proxy_pass         http://frontend_backend;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }
  }
}
